<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starriver Remote</title>
<style>
  :root { color-scheme: dark; }
  body { font: 13px/1.5 ui-monospace, monospace; background: #14161a; color: #d7dae0; margin: 0; padding: 16px; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 14px; margin: 0 8px 0 0; }
  input { background: #1e2127; border: 1px solid #333842; color: #d7dae0; border-radius: 6px; padding: 5px 8px; font: inherit; min-width: 200px; }
  button { background: #2a2f38; border: 1px solid #3a4048; color: #d7dae0; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button.allow { border-color: #2f7d4f; } button.reject { border-color: #8d3838; }
  #status { font-size: 12px; opacity: .75; }
  #feed { display: flex; flex-direction: column; gap: 4px; }
  .ev { padding: 6px 8px; background: #1a1d23; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  .ev .t { color: #7aa2f7; } .ev .seq { opacity: .5; font-size: 11px; }
  .ev .approve { color: #e0af68; }
  .actions { margin-top: 4px; display: flex; gap: 6px; }
</style>
</head>
<body>
<header>
  <h1>Starriver Remote</h1>
  <input id="token" type="password" placeholder="daemon token">
  <button id="connect">Connect</button>
  <span id="status">disconnected</span>
</header>
<div id="feed"></div>
<script>
// WI-113: the minimal remote UI — WS mux client (event feed + approval
// decisions) over /api/v1/mux. Requests reuse the wire Request envelope;
// envelopes (Response/EventEnvelope) arrive as text frames.
const feed = document.getElementById('feed');
const statusEl = document.getElementById('status');
const tokenEl = document.getElementById('token');
tokenEl.value = new URLSearchParams(location.search).get('token') || '';
let ws = null, nextId = 1;

function log(text, cls) {
  const div = document.createElement('div');
  div.className = 'ev' + (cls ? ' ' + cls : '');
  div.textContent = text;
  feed.prepend(div);
  while (feed.children.length > 200) feed.removeChild(feed.lastChild);
}

function invoke(method, params) {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ v: 1, id: 'ui-' + nextId++, method, params }));
}

function handleFrame(message) {
  if (message.method === 'session/update') return; // not used by this shell
  const et = message.event_type;
  const seq = message.global_seq != null ? '#' + message.global_seq : '';
  const sid = message.subscription || '';
  const payload = message.payload || {};
  const base = `[${sid}${seq}] ${et}`;
  if (et === 'approvalRequested') {
    const div = document.createElement('div');
    div.className = 'ev approve';
    const row = document.createElement('div');
    row.textContent = base + ' ' + (payload.toolName || '') + ' ' + (payload.params || '');
    const actions = document.createElement('div');
    actions.className = 'actions';
    const mk = (label, allowed, remember, cls) => {
      const b = document.createElement('button');
      b.textContent = label; b.className = cls;
      b.onclick = () => {
        invoke('approval.respond', { sessionId: payload.sessionId || sid, allowed, remember });
        row.textContent += ' → ' + label;
        actions.remove();
      };
      return b;
    };
    actions.append(
      mk('Allow once', true, false, 'allow'),
      mk('Always allow', true, true, 'allow'),
      mk('Reject', false, false, 'reject'));
    div.append(row, actions);
    feed.prepend(div);
  } else {
    const detail = payload.text || payload.output || payload.summary ||
      (et === 'turnEnd' ? (payload.reason || '') : '');
    log(base + (detail ? ' ' + String(detail).slice(0, 200) : ''));
  }
}

document.getElementById('connect').onclick = () => {
  if (ws) { ws.close(); ws = null; }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = proto + '//' + location.host + '/api/v1/mux?token=' +
    encodeURIComponent(tokenEl.value) + '&after=0';
  statusEl.textContent = 'connecting…';
  ws = new WebSocket(url);
  ws.onopen = () => { statusEl.textContent = 'connected'; log('— connected —'); };
  ws.onclose = () => { statusEl.textContent = 'disconnected'; log('— disconnected —'); };
  ws.onerror = () => { statusEl.textContent = 'error'; };
  ws.onmessage = (e) => {
    try { handleFrame(JSON.parse(e.data)); } catch {}
  };
};
</script>
</body>
</html>
