[package]
name = "starriver-api-macro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Starriver 协议方法属性宏：#[api_method] 从 host 方法签名生成 MethodSpec（schema/取参/错误映射/注册）"

[lib]
proc-macro = true
path = "src/lib.rs"

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "printing", "proc-macro"] }
