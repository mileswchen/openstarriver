[package]
name = "starriver-memory-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone stdio MCP server exposing the starriver shared memory store to any MCP-capable agent (Codex, Claude Code, dsh, zcode, ...)"

[[bin]]
name = "starriver-memory-server"
path = "src/main.rs"

[lib]
name = "starriver_memory_server"
path = "src/lib.rs"

[dependencies]
starriver-memory = { path = "../starriver-memory" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
