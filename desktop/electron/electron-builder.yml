appId: com.starriver.desktop
productName: Starriver
# macOS 26+ modern icon support: when assets/AppIcon.icon exists it is compiled into Assets.car
# and written to CFBundleIconName (see scripts/afterPack-mac.js), so the system no longer forces
# a glass border onto legacy icns; when the file is absent we fall back to legacy icns — packaging unaffected.
afterPack: scripts/afterPack-mac.js
directories:
  output: dist
mac:
  target:
    - dmg
    - zip
  # Stable signing identity: Team/identifier stays constant across rebuilds so TCC grants (local network etc.) survive
  # electron-builder 24.x requires the identity WITHOUT the "Developer ID Application:" prefix and auto-matches the cert
  identity: "Wei Chen (385XN648M3)"
  # 2026-10-02: official distribution needs secure timestamps. timestamp: null previously intended to disable timestamps,
  # but 24.13.3 treats null as default (enabled) — the config was invalid and misleading; official signing keeps the TSA timestamp
  # (timestamp.apple.com verified reachable); on sporadic TSA flake failures in batch signing, just rerun.
  # 2026-10-05: on this network timestamp.apple.com was persistently unreachable / clock-drifted
  # (signing failed mid-way with "timestamps differ by 536 seconds"). DigiCert/Sectigo/
  # Entrust flaked the same way (sectigo/entrust outright rejected codesign transactions, and
  # codesign only supports http TSA URLs), so pin Apple's official http TSA explicitly;
  # when sporadic flake fails a whole round, the outer rerun recovers.
  timestamp: "http://timestamp.apple.com/ts01"
  extendInfo:
    # Without this key, macOS 15+ may silently deny local network access with no consent prompt
    NSLocalNetworkUsageDescription: Starriver 需要访问本地网络,以连接你配置的本地 MCP 服务器与开发工具。
  # The native retina icns is generated by desktop/scripts/make-logo.py (iconutil bundle,
  # full 16..1024 sizes). Previously electron-builder converted from a 512px png on the fly,
  # downsampling small sizes — the icon went blurry.
  icon: assets/icon.icns
win:
  target:
    - nsis
  icon: assets/icon.ico
linux:
  target:
    - AppImage
    - deb
  # Directory of size-named PNGs (gen-icons.py) — a single icon.png makes the
  # deb install into hicolor/0x0/ (unscannable → iconless menu entry).
  icon: assets/icons
  category: Development
files:
  - main.js
  # daemon.js is required by main.js at startup (FPM P4b daemon mode) and
  # itself loads protocol.schema.json — BUG-95: either missing from the asar
  # crashes the main process on launch ("Cannot find module './daemon'").
  - daemon.js
  # Single-instance lock helper, required by main.js line 1 — same BUG-95
  # class: missing from the asar = "Cannot find module './single-instance'".
  - single-instance.js
  - protocol.schema.json
  - preload.js
  # Linux window icon: main.js sets BrowserWindow.icon to this file — without
  # it the title bar/taskbar fall back to the X11 default glyph (the hicolor
  # icons installed by the deb only cover the Applications menu entry).
  - assets/icon.png
  - renderer/**/*
# The NAPI native module ships into resources/ on every platform
# (macOS: Contents/Resources, win/linux: resources/ next to the binary), so
# main.js can require(process.resourcesPath/starriver_desktop.node) uniformly.
# A `files` glob with `../../` silently matches nothing — extraResources is the
# reliable way to pull a file from outside the app dir.
extraResources:
  - from: ../../target/release/
    to: .
    filter:
      - starriver_desktop.node
      - starriverd
      - starriverd.exe
      # ACP server (WI-70): editor/automation entry point, collocated with
      # the daemon. Absent platforms skip silently (mac/linux .exe filter).
      - starriver-acp
      - starriver-acp.exe
      # Windows sandbox helper (writetoken backend); discovered at runtime via
      # helper_path's <install>/resources candidate. Absent on mac/linux —
      # the filter just matches what exists.
      - starriver-sbx-helper.exe
