# `cargo t` = test only the test targets (skips rustdoc doctest extraction,
# which costs minutes per crate even with zero doc examples). Doctests still
# run in CI via plain `cargo test`.
[alias]
t = "test --tests"

# Test/headless escape hatch honored by starriver-secrets + host credential
# paths: macOS keychain round trips stall unsigned test binaries.
# Scoped to this workspace's cargo processes only.
[env]
STARRIVER_DISABLE_KEYCHAIN = "1"
MACOSX_DEPLOYMENT_TARGET = "26.0"

[target.'cfg(target_os = "macos")']
linker = "/usr/bin/c++"

[target.aarch64-apple-ios]
rustflags = [
    "-C", "link-arg=-target", "-C", "link-arg=arm64-apple-ios16.0",
    "-C", "link-arg=-L/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/21/lib/darwin",
    "-C", "link-arg=-lclang_rt.ios",
]
